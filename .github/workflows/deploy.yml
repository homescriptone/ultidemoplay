name: Deploy WordPress Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Playground
        uses: actions/checkout@v4
        with:
          repository: WordPress/wordpress-playground
          ref: trunk
          submodules: recursive
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Build Playground
        run: npm run build:website

      - name: Prepare Accessibility Blueprint
        run: |
          DIST="dist/packages/playground/wasm-wordpress-net"
      
          mkdir -p "$DIST/blueprints"
      
          cp blueprints/accessibility.json \
             "$DIST/blueprints/accessibility.json"

      - name: Set default Blueprint
        run: |
          node scripts/set-default-blueprint.mjs \
            dist/packages/playground/wasm-wordpress-net/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/packages/playground/wasm-wordpress-net

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
