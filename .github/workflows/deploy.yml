
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: playground/.nvmrc
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Restore Nx build cache
        uses: actions/cache@v4
        with:
          path: ~/.nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('playground/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('playground/package-lock.json') }}-

      - name: Install dependencies
        working-directory: playground
        run: npm ci

      - name: Build Playground
        working-directory: playground
        run: npm run build:website

      - name: Prepare Accessibility Blueprint
        run: |
          DIST="playground/dist/packages/playground/wasm-wordpress-net"

          mkdir -p "$DIST/blueprints"

          cp config/blueprints/accessibility.json \
             "$DIST/blueprints/accessibility.json"

      - name: Set default Blueprint
        run: |
          node config/scripts/set-default-blueprint.mjs \
            playground/dist/packages/playground/wasm-wordpress-net/index.html
