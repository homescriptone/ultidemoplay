
name: Deploy WordPress Playground

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      NX_CACHE_DIRECTORY: ${{ github.workspace }}/playground/.nx-cache

    steps:
      - name: Checkout HomeScript configuration
        uses: actions/checkout@v4
        with:
          path: config

      - name: Checkout WordPress Playground
        uses: actions/checkout@v4
        with:
          repository: WordPress/wordpress-playground
          ref: trunk
          submodules: recursive
          fetch-depth: 1
          path: playground

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: playground/.nvmrc
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: playground/.nx-cache
          key: nx-${{ runner.os }}-${{ hashFiles('playground/.nvmrc', 'playground/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('playground/.nvmrc', 'playground/package-lock.json') }}-

      - name: Install dependencies
        working-directory: playground
        run: npm ci

      - name: Build Playground
        working-directory: playground
        run: npm run build:website

      - name: Prepare Accessibility Blueprint
        working-directory: playground
        run: |
          DIST="dist/packages/playground/wasm-wordpress-net"
          mkdir -p "$DIST/blueprints"
          cp ../config/blueprints/accessibility.json \
             "$DIST/blueprints/accessibility.json"

      - name: Set default Blueprint
        working-directory: playground
        run: |
          node ../config/scripts/set-default-blueprint.mjs \
            dist/packages/playground/wasm-wordpress-net/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playground/dist/packages/playground/wasm-wordpress-net

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
